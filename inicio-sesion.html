<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - CorscheCars</title>
    <!-- Traemos Bootstrap desde la nube -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4" style="color: #1C488C;">Iniciar Sesión</h3>
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" id="username" class="form-control" placeholder="Ej: admin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" placeholder="123">
                        </div>
                        <!-- Este botón llama a la función de JavaScript -->
                        <button onclick="iniciarSesion()" class="btn w-100 text-white" style="background-color: #DA291C;">Ingresar</button>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-decoration-none text-muted">Volver al inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Conectamos la lógica -->
    <script src="js/inicio-sesion.js"></script>
</body>
</html>
