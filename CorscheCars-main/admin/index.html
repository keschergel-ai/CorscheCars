<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - CorscheCars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark" style="background-color: #1C488C;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">CorscheCars - Panel de Administración</span>
            <a href="../index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Acciones Rápidas -->
        <div class="row mb-4">
            <div class="col-12">
                <h2 style="color: #1C488C;">Panel de Control</h2>
                <p class="text-muted">Bienvenido al sistema interno. Selecciona una acción para comenzar.</p>
                <div class="d-flex gap-2">
                    <button class="btn text-white" style="background-color: #DA291C;">+ Agregar Nuevo Vehículo</button>
                    <button class="btn text-white" style="background-color: #1C488C;">+ Registrar Nuevo Usuario</button>
                </div>
            </div>
        </div>

        <!-- Sección Gestión de Usuarios -->
        <div class="row mt-4">
            <div class="col-12">
                <h4 class="mb-3" style="color: #1C488C;">Gestión de Usuarios</h4>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Administrador Principal</td>
                                <td><span class="badge bg-danger">Admin</span></td>
                                <td><span class="badge bg-success">Activo</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">Editar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Cliente Ejemplo</td>
                                <td><span class="badge bg-secondary">Cliente</span></td>
                                <td><span class="badge bg-success">Activo</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger">Desactivar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
